<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cue: say it, see it</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230071E3'/%3E%3Cpath d='M12.5 9.5v13l10-6.5z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="window">
    <header class="header">
      <div class="brand">
        <span class="wordmark">Cue</span>
        <span class="brand-divider" aria-hidden="true"></span>
        <span class="tagline">Say it. See it.</span>
        <span id="mode-banner" class="mock" hidden>Mock server</span>
      </div>
      <div id="connection" class="status" data-state="connecting">
        <span id="latency" class="latency" role="status" aria-describedby="timing">Connecting…</span>
        <span id="timing" class="timing" role="tooltip"></span>
      </div>
    </header>

    <!-- Banners float under the header, so showing one never moves the layout. -->
    <div class="banners">
      <p id="video-notice" class="banner" role="status">Connecting to the video server…</p>
      <p id="error" class="banner" role="alert" hidden></p>
    </div>

    <main class="column">
      <!-- The mat and the video: the picture keeps 672:384 and is never cropped or stretched. -->
      <div class="mat">
        <div id="frame" class="frame">
          <canvas id="video" width="672" height="384" aria-label="Live generated video"></canvas>
          <ul id="changes" class="chips" aria-label="Active changes"></ul>
        </div>
      </div>

      <div class="dock">
        <p id="words" class="voice" aria-live="polite"></p>

        <div class="controls">
          <div class="group">
            <button id="undo" type="button" class="icon-btn" aria-label="Undo" title="Undo">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7H4.5V2.5M4.8 7A8 8 0 1 1 4 13" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="group-divider" aria-hidden="true"></span>
            <button id="reset" type="button" class="icon-btn" aria-label="Reset (⌥R)" title="Reset (⌥R)">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v4.5h-4.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>

          <div class="ptt-wrap">
            <span id="ptt-ring" class="ptt-ring" aria-hidden="true"></span>
            <button id="ptt" type="button" class="ptt" aria-pressed="false" aria-label="Hold to talk (`) · Wispr: Ctrl" title="Hold to talk (`) · Wispr: Ctrl">
              <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
          </div>

          <div class="group">
            <button id="keyboard" type="button" class="icon-btn" aria-label="Type a command" title="Type a command" aria-expanded="false" aria-controls="command-form">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M6.5 10h.01M9.5 10h.01M12.5 10h.01M15.5 10h.01M17.5 10h.01M8 14h8" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
            </button>
            <span class="group-divider" aria-hidden="true"></span>
            <button id="fullscreen" type="button" class="icon-btn" aria-label="Full screen" title="Full screen">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </div>

        <!-- Hidden until the Keyboard button opens it, but never display:none: #command keeps focus so
             Wispr Flow can paste into it. -->
        <form id="command-form" class="type" data-open="false" autocomplete="off">
          <svg class="type-icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 10h.01M9 10h.01M12 10h.01M15 10h.01M18 10h.01M8 14h8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <label for="command" class="visually-hidden">Command</label>
          <input id="command" type="text" placeholder="or type a command">
          <button id="send" type="submit" class="send" aria-label="Send" title="Send (Enter)">
            <svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </form>
      </div>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>

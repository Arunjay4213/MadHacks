<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live voice-steered video</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="bar">
    <span id="connection" class="status" data-state="connecting">Connecting…</span>
    <span id="mode-banner" class="banner" hidden>MOCK server: test pattern, not the real engine</span>
    <div class="delay" title="Delay from your command to the first frame generated with it">
      <span id="latency" class="latency">—</span>
      <span id="timing" class="timing"></span>
    </div>
  </header>

  <main class="stage">
    <canvas id="video" width="832" height="480" aria-label="Live generated video"></canvas>
    <p id="video-notice" class="notice" role="status">Connecting to the video server…</p>
  </main>

  <section class="below">
    <p id="words" class="words" aria-live="polite" data-kind="" data-unmatched="false"></p>
    <ul id="changes" class="chips" aria-label="Active changes"></ul>

    <form id="command-form" class="controls" autocomplete="off">
      <input id="command" type="text" aria-label="Command"
             placeholder="Type or speak a command">
      <button id="mic" type="button" aria-pressed="false" title="Live mic on or off. Wispr Flow: hold Ctrl and speak; the sentence lands in the box">Mic</button>
      <button id="ptt" type="button" aria-pressed="false" title="Hold to talk (or hold the ` key)">Hold to talk</button>
      <button id="undo" type="button" title="Undo the last change">Undo</button>
      <button id="reset" type="button" title="Back to the starting scene (Option+R / Alt+R)">Reset</button>
    </form>

    <p id="error" class="error" role="alert" hidden></p>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>
